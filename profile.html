<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar">
      <img class="book-logo" src="images/book-logo.svg" alt="logo" />

      <div class="menu-toggle" id="menu-toggle">☰</div>

      <ul class="ul-navbar">
        <li><a href="index.html">Home</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="courses.html">Courses</a></li>
        <li><a href="contact.html">Contact</a></li>
      </ul>
    </nav>

    <!-- main -->
    <main class="user-info">
      <img src="" alt="" />
      <h2>Name</h2>
      <h2>Age</h2>
      <h2>Grade</h2>
      <h2>Status</h2>
    </main>

    <!-- Section contact -->
    <section class="user-contact">
      <button class="show-email">Show Email</button>
      <button class="show-phone">Show Phone</button>
      <button class="hide-info">Hide Contact Info</button>
    </section>

    <!-- Section status -->
    <section class="user-status">
      <form>
        <input
          type="text"
          placeholder="Enter new status (Active / Suspended)"
        />
        <button>Update</button>
      </form>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <p>© 2026 Bright Future School. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
